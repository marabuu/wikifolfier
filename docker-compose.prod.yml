# Production override: TLS, no published app ports, restart policies.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  frontend:
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN}

  backend:
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_COOKIE_SECURE: "True"
      SESSION_COOKIE_SECURE: "True"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn compendium.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --timeout 60
               --access-logfile -"
    restart: always

  postgres:
    restart: always

  nginx:
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

  # Importer runs on demand:
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
  #     run --rm importer import
  importer:
    build:
      context: .
      dockerfile: importer/Dockerfile
    container_name: compendium_importer
    profiles: ["tools"]
    environment:
      DJANGO_SETTINGS_MODULE: compendium.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MEDIA_ROOT: /app/media
      WIKIDOT_BASE_URL: ${WIKIDOT_BASE_URL:-https://dnd5e.wikidot.com}
      TZ: ${TZ:-UTC}
    volumes:
      - media_data:/app/media
      - import_reports:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks: [compendium]
    restart: "no"

  certbot:
    image: certbot/certbot:latest
    container_name: compendium_certbot
    restart: unless-stopped
    volumes:
      - nginx_letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done"